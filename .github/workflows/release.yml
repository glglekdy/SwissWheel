name: release
on:
  push:
    tags: ['v*']
# Every client installs what this publishes, so the job that runs third-party
# code (actions, build scripts, FFmpeg's installer) can't write to the
# repository; only the small publish job can. Actions are pinned to commits.
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Tag is vX.Y.Z and matches Cargo.toml
        run: |
          # The updater reads only x.y.z; a pre-release tag would break every client's check.
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Error "tag $env:TAG is not vX.Y.Z"
            exit 1
          }
          $meta = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq 'swisswheel').version
          if ($env:TAG.TrimStart('v') -ne $version) {
            Write-Error "tag $env:TAG does not match Cargo.toml version $version"
            exit 1
          }
      - run: choco install ffmpeg -y --no-progress
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p swisswheel
      - name: Checksum
        run: |
          Copy-Item target/release/swisswheel.exe .
          $hash = (Get-FileHash swisswheel.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  swisswheel.exe" | Out-File -Encoding ascii -NoNewline swisswheel.exe.sha256
      # The exe embeds the Pretendard fonts; OFL 1.1 wants the licence with
      # every copy. The updater picks assets by exact name, so this is ignored.
      - run: Copy-Item assets/fonts/OFL.txt .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            swisswheel.exe
            swisswheel.exe.sha256
            OFL.txt
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - run: gh release create "$TAG" swisswheel.exe swisswheel.exe.sha256 OFL.txt --generate-notes
